<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProntoPsi</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Tela de senha (aparece so se houver senha configurada) -->
  <div id="lock" class="lock hidden">
    <div class="lock-card">
      <div id="lock-logo" class="lock-logo"></div>

      <div id="lock-main">
        <h2>Acesso ao sistema</h2>
        <p class="muted">Digite a senha para abrir o ProntoPsi.</p>
        <input id="lock-input" type="password" placeholder="Senha" autocomplete="off" />
        <div id="lock-error" class="lock-error hidden">Senha incorreta.</div>
        <button id="lock-btn" class="btn btn-block">Entrar</button>
        <button id="lock-forgot" class="link-btn">Esqueci minha senha</button>
      </div>

      <!-- Fluxo de recuperacao -->
      <div id="recover" class="hidden">
        <h2>Recuperar senha</h2>
        <p class="muted" id="recover-hint">Informe o e-mail de recuperação cadastrado.</p>
        <input id="recover-email" type="email" placeholder="seu@email.com" autocomplete="off" />
        <div id="recover-code-wrap" class="hidden">
          <input id="recover-code" type="text" placeholder="Código recebido por e-mail" autocomplete="off" />
        </div>
        <input id="recover-newpass" class="hidden" type="password" placeholder="Nova senha" autocomplete="off" />
        <div id="recover-msg" class="lock-error hidden"></div>
        <button id="recover-btn" class="btn btn-block">Enviar</button>
        <button id="recover-back" class="link-btn">Voltar</button>
      </div>
    </div>
  </div>

  <!-- Layout principal: barra lateral + conteudo -->
  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-logo" id="sidebar-logo"></div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="side-item" data-route="#/painel"><span class="ic">🏠</span> Painel</button>
        <button class="side-item" data-route="#/pacientes"><span class="ic">👥</span> Clientes</button>
        <button class="side-item" data-route="#/agenda"><span class="ic">📅</span> Agenda</button>
        <button class="side-item" data-route="#/financeiro"><span class="ic">💰</span> Financeiro</button>
        <button class="side-item" data-route="#/recibos"><span class="ic">🧾</span> Recibos</button>
        <button class="side-item" data-route="#/relatorios"><span class="ic">📊</span> Relatórios</button>
        <button class="side-item" data-route="#/config"><span class="ic">⚙️</span> Configuração</button>
      </nav>
      <div class="sidebar-foot">
        <div class="clinic-mini" id="clinic-mini"></div>
        <div class="app-version" id="app-version"></div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title"></div>
        <div class="topbar-right">
          <div class="zoom-ctrl" id="zoom-ctrl" title="Ajustar tamanho da letra">
            <button id="zoom-out" title="Diminuir">A−</button>
            <span class="zoom-val" id="zoom-val">100%</span>
            <button id="zoom-in" title="Aumentar">A+</button>
          </div>
          <div class="prof-badge" id="prof-badge"></div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
